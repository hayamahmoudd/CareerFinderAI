<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Path Quiz</title>
  <link rel="stylesheet" href="quiz.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Career Path Quiz</h1>
    <p class="subtitle">
      Answer personalized questions to discover careers that match your unique profile.
    </p>
    
    <div class="progress-container">
      <div class="progress-text">Question <span id="currentQ">1</span> of <span id="totalQ">6</span></div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar" style="width: 16.67%"></div>
      </div>
    </div>
    
    <form id="careerQuizForm">
      <div id="questionsContainer"></div>
      
      <div class="button-group">
        <button type="button" id="prevBtn" class="hidden">Previous</button>
        <button type="button" id="nextBtn">Next</button>
      </div>
    </form>

    <div id="result" class="hidden"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
