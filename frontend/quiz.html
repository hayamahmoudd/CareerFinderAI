<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Path Quiz</title>
  <link rel="stylesheet" href="quiz.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Career Path Quiz</h1>
    <p style="text-align: center; color: #6b7280; margin-bottom: 2rem;">
      Answer these questions to discover career paths that match your interests and strengths.
    </p>
    
    <form id="careerQuizForm">
      <div class="question">
        <label>1. What do you enjoy more?</label><br>
        <label for="q1a">
          <input type="radio" id="q1a" name="q1" value="working with people" required> 
          Working with people
        </label><br>
        <label for="q1b">
          <input type="radio" id="q1b" name="q1" value="solving technical problems"> 
          Solving technical problems
        </label><br>
        <label for="q1c">
          <input type="radio" id="q1c" name="q1" value="organizing and planning"> 
          Organizing and planning
        </label><br>
      </div>

      <div class="question">
        <label>2. What environment do you prefer?</label><br>
        <label for="q2a">
          <input type="radio" id="q2a" name="q2" value="outdoors" required> 
          Outdoors
        </label><br>
        <label for="q2b">
          <input type="radio" id="q2b" name="q2" value="office setting"> 
          Office setting
        </label><br>
        <label for="q2c">
          <input type="radio" id="q2c" name="q2" value="lab or workshop"> 
          Lab or workshop
        </label><br>
      </div>

      <div class="question">
        <label>3. Which subject do you like most?</label><br>
        <label for="q3a">
          <input type="radio" id="q3a" name="q3" value="biology" required> 
          Biology
        </label><br>
        <label for="q3b">
          <input type="radio" id="q3b" name="q3" value="math and coding"> 
          Math and Coding
        </label><br>
        <label for="q3c">
          <input type="radio" id="q3c" name="q3" value="writing and communication"> 
          Writing and Communication
        </label><br>
      </div>

      <button type="submit">Get My Career Recommendations</button>
    </form>

    <div id="result" class="hidden"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
