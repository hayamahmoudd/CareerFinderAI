<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Your Career Recommendations</title>
    <link rel="stylesheet" href="quiz.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <h1>Your Career Recommendations</h1>
      <div id="result"></div>
      <button id="backHome">Back to Home</button>
    </div>
    
    <script>
      // Get result from localStorage
      let resultData = localStorage.getItem("careerResult");
      const resultDiv = document.getElementById("result");
      
      if (!resultData) {
        resultDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">No results found. Please take the quiz first.</p>';
      } else {
        try {
          const data = JSON.parse(resultData);
          
          if (data.success && data.careers && Array.isArray(data.careers)) {
            // Display summary
            let html = `<div class="career-summary">${data.summary || 'Based on your interests, here are your personalized career recommendations:'}</div>`;
            
            // Display career cards
            html += '<div class="career-cards">';
            
            data.careers.forEach((career, index) => {
              html += `
                <div class="career-card">
                  <span class="career-title">${career.title || 'Career Path ' + (index + 1)}</span>
                  <p class="career-description">${career.description || 'A great career option based on your interests.'}</p>
                  
                  ${career.steps && career.steps.length > 0 ? `
                    <div class="career-steps">
                      <h4>Steps to Achieve This Career:</h4>
                      <ol>
                        ${career.steps.map(step => `<li>${step}</li>`).join('')}
                      </ol>
                    </div>
                  ` : ''}
                </div>
              `;
            });
            
            html += '</div>';
            resultDiv.innerHTML = html;
          } else {
            resultDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">Unable to display results. Please try taking the quiz again.</p>';
          }
        } catch (error) {
          console.error("Error parsing results:", error);
          resultDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">Error displaying results. Please try again.</p>';
        }
      }
      
      // Back to home button
      document.getElementById("backHome").onclick = function () {
        localStorage.removeItem("careerResult"); // Clean up
        window.location.href = "index.html";
      };
    </script>
  </body>
</html>
